name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Clippy, Format, Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache swift-syntax build
        uses: actions/cache@v4
        with:
          path: crates/swiftgraph-parser/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('crates/swiftgraph-parser/Package.swift') }}

      - name: Build swiftgraph-parser
        working-directory: crates/swiftgraph-parser
        run: swift build -c release

      - name: Test swiftgraph-parser
        working-directory: crates/swiftgraph-parser
        run: swift test

      - name: Check
        run: cargo check --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        env:
          SWIFTGRAPH_PARSER_PATH: ${{ github.workspace }}/crates/swiftgraph-parser/.build/release/swiftgraph-parser
        run: cargo test --workspace --locked
